<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Skin Care</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Georgia', serif;
}

body{
    background:#ffffff;
}

/* HERO */

.hero{
    height:200px;
    background:linear-gradient(
        rgba(31, 71, 48, 0.65),
        rgba(31, 71, 48, 0.65)
    ),
    url('banner.jpg');
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
}

.hero-content{
    max-width:700px;
}

.hero h1{
    font-size:3rem;
    margin-bottom:20px;
}

.hero p{
    font-size:1.2rem;
    margin-bottom:25px;
}

.btn{
    background:#2e7d32;
    color:white;
    padding:14px 35px;
    border:none;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    background:#1b5e20;
}

/* PRODUCTOS */

.products{
    padding:80px 8%;
    text-align:center;
}

.products h2{
    margin-bottom:50px;
    font-size:3rem;
    color:#234d20;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:30px;
}

.product-card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

/* IMPORTANTE */
/* Las imágenes SIEMPRE ocuparán el mismo espacio */

.product-card img{
    width:100%;
    height:280px;
    object-fit:cover;
    border-radius:10px;
}

.product-card h3{
    margin-top:15px;
    color:#234d20;
    min-height:50px;
}

/* IMPORTANTE */
/* El texto conserva espacio */

.description{
    height:50px;
    overflow:hidden;
    margin:10px 0;
    color:#666;
}

.price{
    font-size:22px;
    font-weight:bold;
    color:#2e7d32;
    margin-bottom:15px;
}

.buy-btn{
    background:#2e7d32;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:25px;
    cursor:pointer;
    width:100%;
}

.buy-btn:hover{
    background:#1b5e20;
}

</style>
</head>
<body>

<section class="hero">
    <div class="hero-content">
        <h1>Productos</h1>
        <p>
            Totalmente reutilizables
        </p>
        
    </div>
</section>

<section class="products">

    <h2>Lo Más Vendido</h2>

    <div class="product-grid">

        <div class="product-card">
            <img src="Planta.jpg" alt="">
            <h3>Planta decorativa</h3>
           
            <div class="price">$50</div>
            <button class="buy-btn">Añadir al carrito</button>
        </div>

        <div class="product-card">
            <img src="Cepillos.jpg" alt="">
            <h3>Cepillos de Bambú</h3>
          
            <div class="price">$70</div>
            <button class="buy-btn">Añadir al carrito</button>
        </div>

        <div class="product-card">
            <img src="Bolsa.jpg" alt="">
            <h3>Bolsa reutilizable</h3>
            
            <div class="price">$80</div>
            <button class="buy-btn">Añadir al carrito</button>
        </div>

        <div class="product-card">
            <img src="Botella.jpg" alt="">
            <h3>Botella reutilizable</h3>
           
            <div class="price">$100</div>
            <button class="buy-btn">Añadir al carrito</button>
        </div>

    </div>

</section>

</body>
</html>
